# בונה את קובץ ה-APK לאנדרואיד בכל עדכון, ומפרסם אותו בדף ה-Releases של המאגר
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: app
        run: npm ci

      - name: Copy web files into the app
        working-directory: app
        run: npm run sync

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_BASE64 בהגדרות המאגר (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/limud-release.jks

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk limud.apk

      - name: Move the apk-latest tag to this commit
        run: |
          git tag -f apk-latest
          git push -f origin apk-latest

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "אפליקציית אנדרואיד – גרסה 1.0.${{ github.run_number }}"
          body: |
            קובץ ההתקנה לאנדרואיד: **limud.apk** (למטה, תחת Assets).
            קישור ישיר: https://github.com/${{ github.repository }}/releases/latest/download/limud.apk
          files: limud.apk
          make_latest: true
