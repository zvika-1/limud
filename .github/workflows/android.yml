# בונה את קובץ ה-APK לאנדרואיד בכל עדכון, ומפרסם אותו בדף ה-Releases של המאגר
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: app
        run: npm ci

      - name: Compute version number
        id: ver
        run: |
          MAJOR=$(node -p "require('./app/version.json').major")
          START=$(node -p "require('./app/version.json').startRun")
          MINOR=$(( ${{ github.run_number }} - START + 1 ))
          VERSION=$(printf "%d.%02d" "$MAJOR" "$MINOR")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "גרסה: $VERSION"

      - name: Copy web files into the app
        working-directory: app
        run: |
          npm run copy-web
          echo "${{ steps.ver.outputs.version }}" > www/version.txt
          npx cap sync android

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_BASE64 בהגדרות המאגר (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/limud-release.jks

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.version }}

      - name: Name the APK files
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk limud.apk
          cp limud.apk "limud-${{ steps.ver.outputs.version }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "הלימוד היומי שלי – גרסה ${{ steps.ver.outputs.version }}"
          body: |
            קובץ ההתקנה לאנדרואיד: **limud-${{ steps.ver.outputs.version }}.apk** (למטה, תחת Assets).
            קישור קבוע לגרסה האחרונה תמיד: https://github.com/${{ github.repository }}/releases/latest/download/limud.apk
          files: |
            limud-${{ steps.ver.outputs.version }}.apk
            limud.apk
          make_latest: true
